apply plugin: 'com.android.application'

android {
    namespace = "io.github.leonidan1988.omronbp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.leonidan1988.omronbp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 65
        versionName "0.41.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            /*
             * Ключ пока отладочный, и это осознанно, а не недоделка.
             *
             * Своя подпись нужна для магазина, но сменить её значит порвать
             * обновление поверх: Android не ставит поверх приложение с другим
             * ключом, и на телефоне с настоящим дневником обновление
             * потребовало бы удаления вместе с данными. Пока идёт семейный
             * тест, важнее, чтобы новые версии вставали поверх старых.
             *
             * Что эта сборка даёт против отладочной: `debuggable` выключен,
             * то есть подключиться к дневнику с компьютера по кабелю больше
             * нельзя. Ради этого она и собирается — на чужом телефоне отладка
             * включённой быть не должна.
             *
             * Перед магазином ключ придётся завести настоящий и один раз
             * переустановить приложение с переносом дневника через копию.
             */
            signingConfig signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/*
 * Сторож отладки WebView.
 *
 * `webContentsDebuggingEnabled` выключается переменной `OMRON_RELEASE=1`, но
 * действует она только в момент `cap sync`. Собрать выпуск после обычного
 * `cap sync` ничто не мешало — и тогда дневник читается с компьютера по
 * кабелю без пароля, через `chrome://inspect`.
 *
 * Проверяем то, что реально попадёт в APK: файл настроек, который сборка
 * кладёт в assets. Падаем на сборке выпуска, а не показываем предупреждение:
 * предупреждения в гигабайтном выводе Gradle не читает никто.
 */
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease' || task.name == 'bundleRelease') {
        task.doFirst {
            def конфиг = file('src/main/assets/capacitor.config.json')
            if (!конфиг.exists()) {
                throw new GradleException('Нет assets/capacitor.config.json — сначала `npx cap sync android`.')
            }
            def текст = конфиг.text
            if (текст =~ /"webContentsDebuggingEnabled"\s*:\s*true/) {
                throw new GradleException(
                    'Отладка WebView включена в выпускной сборке. Пересоберите так:\n' +
                    '    OMRON_RELEASE=1 npm run build && OMRON_RELEASE=1 npx cap sync android\n' +
                    'Иначе дневник читается с компьютера по кабелю без пароля.')
            }
        }
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
