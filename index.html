<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Chrome ужимает вьюпорт под экранную
         клавиатуру, и прилипшая снизу кнопка «Добавить» остаётся видимой. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0efec" media="(prefers-color-scheme: light)" />
    <!-- Выбранная тема применяется до первой отрисовки. Настройки лежат в
         IndexedDB и читаются асинхронно — если ждать их, тёмный экран успеет
         мигнуть белым. Поэтому выбор продублирован в localStorage: он читается
         синхронно и только для этой строчки. -->
    <script>
      try {
        var root = document.documentElement
        var choice = localStorage.getItem('theme')
        if (choice === 'light' || choice === 'dark') root.dataset.theme = choice
        // Размер текста и плотность — по той же причине: иначе вёрстка успеет
        // отрисоваться одним размером и прыгнуть на другой.
        var text = localStorage.getItem('textScale')
        if (text === 'small' || text === 'large' || text === 'xlarge') root.dataset.text = text
        var density = localStorage.getItem('density')
        if (density === 'compact' || density === 'roomy') root.dataset.density = density
        if (localStorage.getItem('interfaceStyle') === 'modern') root.dataset.interface = 'modern'
      } catch (e) {
        /* приватный режим может запретить хранилище — тогда остаётся системная тема */
      }
    </script>
    <!-- Спасение от пустого экрана.

         Имена собранных файлов содержат хэш и меняются с каждой выкаткой, а
         старые удаляются. Если браузер или служебный работник отдаст
         устаревший index.html, тот сошлётся на файл, которого на сервере уже
         нет, — и человек увидит не старую версию, а белый экран. Для дневника,
         который обещает сохранность записей, это выглядит как потеря всего.

         Поэтому: не загрузился скрипт — один раз чистим кэши, снимаем
         служебного работника и перезагружаемся. Метка в sessionStorage
         страхует от вечного круга, если дело окажется не в кэше. -->
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var node = event.target
          if (!node || node.tagName !== 'SCRIPT' || node === event.currentTarget) return
          // Без сети чистить кэш нельзя: он единственное, из чего приложение
          // вообще может подняться. Эта поломка бывает только на связи —
          // страница приходит устаревшая, а файлы к ней с сервера уже убраны.
          if (navigator.onLine === false) return
          try {
            if (sessionStorage.getItem('omron-recovery')) return
            sessionStorage.setItem('omron-recovery', '1')
          } catch (e) {
            return
          }
          var done = function () {
            location.reload()
          }
          var cleared = window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (key) {
                    return caches.delete(key)
                  }),
                )
              })
            : Promise.resolve()
          cleared
            .then(function () {
              if (!navigator.serviceWorker) return
              return navigator.serviceWorker.getRegistrations().then(function (list) {
                return Promise.all(
                  list.map(function (item) {
                    return item.unregister()
                  }),
                )
              })
            })
            .then(done, done)
        },
        true,
      )
    </script>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- iOS не понимает SVG на домашнем экране: без этой строки значок там
         подставлялся чужой, а приложение само советует добавить его на экран —
         именно так на iPhone включается постоянное хранилище. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Дневник здоровья · давление и сахар</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
